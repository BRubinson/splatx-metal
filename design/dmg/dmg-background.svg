<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400">
<!-- DMG installer background (for direct distribution). Based on app icon at (165,200), Applications alias at (495,200). -->
<defs>
  <radialGradient id="bbg" cx=".5" cy=".3" r="1.1">
    <stop offset="0" stop-color="#14181E"/><stop offset=".6" stop-color="#0B0E12"/>
    <stop offset="1" stop-color="#060809"/></radialGradient>
  <radialGradient id="glow1" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#1E9A55" stop-opacity=".28"/><stop offset="1" stop-color="#1E9A55" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow2" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#47E0C4" stop-opacity=".14"/><stop offset="1" stop-color="#47E0C4" stop-opacity="0"/></radialGradient>
  <linearGradient id="ct" x1="0" y1="105" x2="0" y2="128" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FDFEFF"/><stop offset=".3" stop-color="#DCE5EC"/>
    <stop offset=".62" stop-color="#AAB6C1"/><stop offset=".84" stop-color="#8794A0"/>
    <stop offset="1" stop-color="#66727E"/></linearGradient>
  <linearGradient id="cu" x1="0" y1="128" x2="0" y2="151" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#39434D"/><stop offset=".3" stop-color="#2A323B"/>
    <stop offset=".62" stop-color="#57626D"/><stop offset=".85" stop-color="#3E4750"/>
    <stop offset="1" stop-color="#1F262D"/></linearGradient>
  <linearGradient id="gt" x1="0" y1="105" x2="0" y2="128" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#F4FFE0"/><stop offset=".28" stop-color="#B9F07E"/>
    <stop offset=".62" stop-color="#7CE04A"/><stop offset=".86" stop-color="#4CBE45"/>
    <stop offset="1" stop-color="#2E9D43"/></linearGradient>
  <linearGradient id="gu" x1="0" y1="128" x2="0" y2="151" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#0F8A50"/><stop offset=".3" stop-color="#0A6B3E"/>
    <stop offset=".55" stop-color="#129959"/><stop offset=".8" stop-color="#095C34"/>
    <stop offset="1" stop-color="#04351E"/></linearGradient>
  <filter id="s10" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="10"/></filter>
  <filter id="s4" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
  <clipPath id="cc"><path d="M 29 128 Q 128 105 227 128 Q 128 151 29 128 Z" transform="rotate(-45 128 128)"/></clipPath>
  <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#E9EEF3"/><stop offset="1" stop-color="#9AA6B2"/></linearGradient>
</defs>
<rect width="660" height="400" fill="url(#bbg)"/>
<ellipse cx="140" cy="60" rx="260" ry="150" fill="url(#glow1)"/>
<ellipse cx="540" cy="360" rx="260" ry="140" fill="url(#glow2)"/>
<g transform="translate(266,36) scale(0.5)">

  <g transform="translate(0,8)" opacity=".4" filter="url(#s10)">
    <path d="M 29 128 Q 128 105 227 128 Q 128 151 29 128 Z" transform="rotate(45 128 128)"/>
    <path d="M 29 128 Q 128 105 227 128 Q 128 151 29 128 Z" transform="rotate(-45 128 128)"/>
  </g>
  <g transform="rotate(-45 128 128)">
    <path d="M 29 128 Q 128 105 227 128 Z" fill="url(#ct)"/>
    <path d="M 29 128 Q 128 151 227 128 Z" fill="url(#cu)"/>
    <path d="M 44 128 L 212 128" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity=".8"/>
  </g>
  <g clip-path="url(#cc)"><circle cx="128" cy="128" r="32" fill="#000" opacity=".42" filter="url(#s4)"/></g>
  <g transform="rotate(45 128 128)">
    <path d="M 29 128 Q 128 105 227 128 Z" fill="url(#gt)"/>
    <path d="M 29 128 Q 128 151 227 128 Z" fill="url(#gu)"/>
    <path d="M 44 128 L 212 128" stroke="#F4FFE0" stroke-width="1.1" stroke-linecap="round" opacity=".85"/>
  </g>

</g>
<g stroke="#66727E" stroke-width="5" fill="none" stroke-linecap="round">
  <path d="M 250 205 L 400 205" stroke-dasharray="1 14"/>
  <path d="M 385 188 L 412 205 L 385 222" fill="none"/>
</g>
<text x="330" y="330" text-anchor="middle" font-family="-apple-system,'SF Pro Text',sans-serif"
  font-size="17" fill="#8B95A1">Drag SplatX Metal Trainer into Applications</text>
</svg>