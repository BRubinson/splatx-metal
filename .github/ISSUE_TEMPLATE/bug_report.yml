name: Bug report
description: Something built, ran, or trained incorrectly
labels: ["needs-repro"]
body:
  - type: input
    id: chip
    attributes:
      label: Chip and memory
      description: e.g. M4, 24 GB
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: macOS / iOS version
      description: e.g. macOS 26.2
    validations:
      required: true
  - type: input
    id: xcode
    attributes:
      label: Xcode version
      description: Output of `xcodebuild -version`
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command or action
      description: >-
        The full CLI command (including flags) or the app action that
        triggered the problem. For dataset-dependent issues, describe the
        dataset shape (number of images, factor, COLMAP bin/txt).
      render: sh
    validations:
      required: true
  - type: textarea
    id: gates
    attributes:
      label: Gate results (if you ran them)
      description: >-
        Output of `swift run splatx-core-tests` (last lines) and/or the app
        test run — this tells us whether your toolchain baseline is healthy.
      render: text
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      description: What you expected, what happened instead, full error output.
    validations:
      required: true
